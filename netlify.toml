[build]
  command = "cd client && npm install && npm run build"
  publish = "client/dist"
  functions = "server/netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["server/**"]

# Redirect API requests to the serverless Netlify Function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Single Page App (SPA) redirect for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
