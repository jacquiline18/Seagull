<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" width="100%" height="100%">
  <!-- Exact Seagull General Supply Limited Brand Logo -->
  <defs>
    <style>
      .seagull-circle { fill: #1B4268; }
      .seagull-bird { fill: #FFFFFF; }
      .seagull-eye { fill: #1B4268; }
      .wave-dark { fill: #1B4268; }
      .wave-light { fill: #2E8BC9; }
    </style>
  </defs>

  <!-- Dark Blue Circle Badge -->
  <circle cx="85" cy="80" r="54" class="seagull-circle" />

  <!-- White Flying Seagull with Wing Extending to Top-Right Outside the Circle -->
  <path class="seagull-bird" d="
    M 38 78 
    C 42 77, 46 75, 48 71 
    C 52 64, 58 63, 64 64 
    C 69 65, 74 68, 80 67
    C 86 64, 94 58, 105 52
    C 118 45, 134 38, 148 35
    C 142 41, 134 47, 126 53
    C 119 58, 114 62, 108 67
    C 114 68, 120 70, 126 73
    C 120 75, 112 77, 104 77
    C 96 78, 89 83, 83 89
    C 78 94, 71 96, 64 96
    C 56 96, 49 92, 45 87
    C 42 83, 39 80, 38 78
    Z
  " />

  <!-- Seagull Eye Detail -->
  <circle cx="53" cy="71" r="3.2" class="seagull-eye" />
  <circle cx="53.8" cy="70.5" r="1.1" fill="#FFFFFF" />

  <!-- Lower Flying Tail/Wing Detail -->
  <path class="seagull-bird" d="
    M 90 84 
    C 98 87, 108 89, 118 90
    C 110 93, 100 95, 92 94
    C 87 91, 85 88, 90 84
    Z
  " opacity="0.95" />
</svg>
