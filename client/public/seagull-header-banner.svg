<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="100%" height="100%">
  <defs>
    <style>
      .brand-title { font-family: 'Outfit', 'Plus Jakarta Sans', Arial, sans-serif; font-weight: 800; font-size: 34px; fill: #163A59; letter-spacing: 0.5px; }
      .brand-tagline { font-family: 'Outfit', 'Plus Jakarta Sans', Arial, sans-serif; font-weight: 600; font-style: italic; font-size: 24px; fill: #2E8BC9; }
      .contact-text { font-family: 'Plus Jakarta Sans', Arial, sans-serif; font-size: 17px; fill: #111827; font-weight: 600; }
      .contact-label { font-weight: 700; color: #163A59; }
    </style>
  </defs>

  <!-- Background Pure White -->
  <rect width="1000" height="280" fill="#FFFFFF" />

  <!-- Logo Group on Left -->
  <g transform="translate(60, 20)">
    <!-- Circle -->
    <circle cx="75" cy="75" r="62" fill="#1B4268" />
    <!-- Bird with Wing Extending Past Circle -->
    <path fill="#FFFFFF" d="
      M 22 73 
      C 27 72, 31 70, 34 66 
      C 38 58, 45 57, 52 58 
      C 58 59, 64 63, 71 62
      C 78 58, 87 51, 100 44
      C 115 36, 134 28, 150 24
      C 143 31, 134 38, 125 45
      C 117 51, 111 56, 104 62
      C 111 63, 118 66, 125 69
      C 118 71, 109 73, 100 73
      C 91 74, 83 80, 76 87
      C 70 93, 62 95, 54 95
      C 45 95, 37 90, 32 84
      C 28 80, 24 76, 22 73
      Z
    " />
    <circle cx="40" cy="66" r="3.6" fill="#1B4268" />
    <circle cx="41" cy="65.3" r="1.2" fill="#FFFFFF" />
    <path fill="#FFFFFF" d="M 85 81 C 94 85, 106 87, 118 88 C 109 91, 98 93, 89 92 C 83 89, 81 85, 85 81 Z" />
  </g>

  <!-- Company Typography -->
  <text x="240" y="70" class="brand-title">SEAGULL GENERAL SUPPLY LIMITED</text>
  <text x="390" y="105" class="brand-tagline">Services Beyond Measure!</text>

  <!-- Contact Details Row 1 -->
  <!-- Phone -->
  <g transform="translate(240, 132)">
    <path d="M 4 2 C 2 2, 0 4, 0 6 C 0 15, 7 22, 16 22 C 18 22, 20 20, 20 18 L 17 13 C 16 12, 14 12, 13 13 L 11 14 C 8 12, 6 10, 5 7 L 7 5 C 8 4, 8 2, 7 1 L 4 2 Z" fill="#163A59" transform="scale(0.8)" />
    <text x="24" y="14" class="contact-text">Phone: +255 (0) 743 611 101</text>
  </g>

  <!-- Website -->
  <g transform="translate(610, 132)">
    <circle cx="9" cy="9" r="8" stroke="#2E8BC9" stroke-width="1.8" fill="none" />
    <path d="M 1 9 L 17 9 M 9 1 C 12 4, 12 14, 9 17 M 9 1 C 6 4, 6 14, 9 17" stroke="#2E8BC9" stroke-width="1.5" fill="none" />
    <text x="24" y="14" class="contact-text">Website: www.seagull.co.tz</text>
  </g>

  <!-- Contact Details Row 2 -->
  <!-- Email -->
  <g transform="translate(240, 168)">
    <rect x="0" y="2" width="18" height="13" rx="2" fill="#163A59" />
    <path d="M 0 3 L 9 9 L 18 3" stroke="#FFFFFF" stroke-width="1.5" fill="none" />
    <text x="24" y="14" class="contact-text">Email: seagull.tech20@gmail.com</text>
  </g>

  <!-- Instagram -->
  <g transform="translate(610, 168)">
    <rect x="0" y="0" width="17" height="17" rx="4" fill="none" stroke="#E1306C" stroke-width="1.8" />
    <circle cx="8.5" cy="8.5" r="4" fill="none" stroke="#E1306C" stroke-width="1.8" />
    <circle cx="13" cy="4" r="1" fill="#E1306C" />
    <text x="24" y="14" class="contact-text">Instagram: Seagull5816</text>
  </g>

  <!-- Bottom Brand Waves Matching Reference Image -->
  <!-- Top Dark Blue Wave -->
  <path class="wave-dark" d="
    M 30 175
    C 120 205, 260 220, 480 228
    C 700 236, 880 248, 970 252
    L 970 262
    C 880 258, 700 246, 480 238
    C 260 230, 120 215, 30 185
    Z
  " />

  <!-- Bottom Sky Blue Wave -->
  <path class="wave-light" d="
    M 30 188
    C 140 216, 280 232, 500 242
    C 720 252, 890 264, 970 268
    L 970 274
    C 890 270, 720 258, 500 248
    C 280 238, 140 222, 30 196
    Z
  " />
</svg>
